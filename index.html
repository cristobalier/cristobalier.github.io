<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dexter</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --tx: #14161a;
      --mu: #6b7280;
      --ln: #e5e7eb;
      --ac: #2f6bff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115;
        --card: #1a1d23;
        --tx: #eef0f3;
        --mu: #98a0ad;
        --ln: #2a2e36;
        --ac: #6b93ff
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #1a1d23;
      --tx: #eef0f3;
      --mu: #98a0ad;
      --ln: #2a2e36;
      --ac: #6b93ff
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 10
    }

    #root {
      max-width: 640px;
      margin: auto
    }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      padding: 12px 14px 8px
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px
    }

    .bar {
      height: 8px;
      border-radius: 4px;
      background: var(--ln);
      overflow: hidden;
      margin: 6px 0 10px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac)
    }

    .top {
      display: flex;
      justify-content: space-between;
      color: var(--mu);
      font-size: 14px
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--ln);
      background: var(--card);
      color: var(--tx);
      font-size: 16px
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 2px
    }

    .chips button {
      flex: none;
      border: 1px solid var(--ln);
      background: var(--card);
      color: var(--tx);
      border-radius: 16px;
      padding: 5px 11px;
      font-size: 14px
    }

    .chips button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    h2 {
      margin: 16px 14px 6px;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--mu);
      display: flex;
      justify-content: space-between
    }

    .list {
      background: var(--card);
      margin: 0 10px;
      border-radius: 12px;
      overflow: hidden
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--ln);
      cursor: pointer
    }

    .row:last-child {
      border: 0
    }

    .sp {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg);
      object-fit: contain;
      flex: none
    }

    .ph {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mu);
      font-weight: 700
    }

    .nm {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .nm small {
      color: var(--mu);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mu {
      color: var(--mu);
      font-weight: 400
    }

    .tg {
      font-weight: 700;
      font-size: 14px
    }

    .y {
      color: #e0a800
    }

    .p {
      color: #9b5de5
    }

    .o {
      color: #f77f00
    }

    .ck {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--ln);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none
    }

    .ck.on {
      background: var(--ac);
      border-color: var(--ac)
    }

    .empty {
      text-align: center;
      color: var(--mu);
      padding: 40px
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sh {
      background: var(--card);
      width: 100%;
      max-width: 640px;
      border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      max-height: 85vh;
      overflow: auto
    }

    .hd {
      text-align: center
    }

    .hd .sp {
      width: 96px;
      height: 96px
    }

    .hd h3 {
      margin: 6px 0 14px
    }

    .tgl {
      display: flex;
      gap: 8px;
      margin: 12px 0
    }

    .tgl button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--ln);
      background: var(--bg);
      color: var(--tx);
      font-size: 15px
    }

    .tgl button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .add {
      display: flex;
      gap: 8px
    }

    .add button,
    .rel {
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: var(--ac);
      color: #fff;
      font-size: 15px
    }

    .gc {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0
    }

    .gc span {
      background: var(--bg);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 14px
    }

    .gc b {
      margin-left: 6px;
      cursor: pointer;
      color: var(--mu)
    }

    .r {
      color: #e5484d
    }

    .rel {
      background: #e5484d;
      width: 100%;
      margin-top: 8px
    }

    .cl {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 0;
      background: none;
      color: var(--mu);
      font-size: 15px
    }

    .hint {
      color: var(--mu);
      font-size: 13px;
      margin: 6px 2px 0
    }

    .opts {
      display: flex;
      gap: 6px;
      margin-top: 8px
    }

    .opts select,
    .opts button {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      font-size: 13px;
      border-radius: 9px;
      border: 1px solid var(--ln);
      background: var(--card);
      color: var(--tx)
    }

    .opts button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .num {
      color: var(--mu);
      font-size: 12px;
      font-weight: 400;
      margin-right: 4px
    }

    footer {
      margin: 22px 10px 10px;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--mu)
    }

    footer p {
      margin: 0 0 10px
    }

    footer .lk {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px
    }

    footer a {
      color: var(--tx);
      text-decoration: none;
      border: 1px solid var(--ln);
      border-radius: 16px;
      padding: 6px 12px;
      background: var(--bg)
    }

    footer a.kofi {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    footer small {
      display: block;
      margin-top: 12px;
      font-size: 12px
    }
  </style>
</head>

    function Footer() {
      return html`<footer>
  <p>Dexter es un proyecto independiente. ¿Ideas, errores o sugerencias? Escríbeme o sígueme, y si te sirve puedes apoyar el proyecto.</p>
  <div class="lk"><a href="https://www.instagram.com/cristobalier" target="_blank" rel="noopener">Instagram @cristobalier</a>
  <a href="#" onClick=${ev => { ev.preventDefault(); location.href = 'mai' + 'lto:' + ['onirico14todo', 'icloud.com'].join('@') }}>✉ Escríbeme</a>
  <a class="kofi" href="https://ko-fi.com/cristobalier" target="_blank" rel="noopener">☕ Apóyame en Ko-fi</a></div>
  <small>Datos de disponibilidad aproximados. Pokémon y sus nombres son marcas de sus respectivos dueños.</small></footer>`}
    function App() {
      const [data, setData] = useState(load); const [q, setQ] = useState(''); const [reg, setReg] = useState(-1); const [gm, setGm] = useState(''); const [sel, setSel] = useState(null);
      const [pr, setPr] = useState(loadP); const sp = (k, v) => setPr(p => ({ ...p, [k]: v }));
      useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(data)) } catch (e) { } }, [data]);
      useEffect(() => { try { localStorage.setItem(PKEY, JSON.stringify(pr)) } catch (e) { } }, [pr]);
      const gs = arr => [...arr].sort(GSORT[pr.go] || GSORT.new);
      const upd = (n, fn) => setData(d => { const x = { ...blank, ...(d[n] || {}) }; x.games = [...x.games]; fn(x); const r = { ...d }; (!x.games.length && !x.shiny && !x.alpha && !x.mega && !x.gmax) ? delete r[n] : r[n] = x; return r });
      const del = n => setData(d => { const r = { ...d }; delete r[n]; return r });
      const av = x => (FAV[x.k] || AV[x.b] || []).map(i => GAMES[i]);
      const inG = x => !gm || av(x).includes(gm);
      const own = n => gm ? !!(data[n] && data[n].games.includes(gm)) : !!(data[n] && data[n].games.length);
      const tgl = n => upd(n, x => { x.games = x.games.includes(gm) ? x.games.filter(z => z !== gm) : [...x.games, gm] });
      const base = ENTRIES.map(l => l.filter(x => (pr.forms || !x.f) && inG(x)));
      const cnt = base.map(l => l.filter(x => !x.f));
      const total = cnt.reduce((a, l) => a + l.length, 0);
      const owned = cnt.reduce((a, l) => a + l.filter(x => own(x.k)).length, 0);
      const nq = norm(q);
      const cmp = pr.po === 'az' ? (a, b) => label(a, pr.forms).localeCompare(label(b, pr.forms), 'es') : pr.po === 'desc' ? (a, b) => b.o - a.o : (a, b) => a.o - b.o;
      let groups = REGIONS.map((r, i) => ({ r, i, all: cnt[i], list: base[i].filter(x => !nq || norm(label(x, pr.forms)).includes(nq)).sort(cmp) })).filter(g => (reg < 0 || g.i === reg) && g.list.length);
      if (pr.po === 'desc') groups = groups.slice().reverse();
      const sx = sel && ENTRIES.flat().find(x => x.k === sel);
      return html`<div><header><h1>Dexter</h1>
  <div class="top"><span>${gm || 'Living Dex'}</span><span>${owned} / ${total} · ${total ? (owned / total * 100).toFixed(1) : 0} %</span></div>
  <div class="bar"><i style=${{ width: (total ? owned / total * 100 : 0) + '%' }}></i></div>
  <select value=${gm} onChange=${e => setGm(e.target.value)}><option value="">Todos los juegos (Living Dex)</option>${gs(GAMES).map(x => html`<option key=${x} value=${x}>Jugando: ${x}</option>`)}</select>
  <div class="opts">
   <select aria-label="Orden de los juegos" value=${pr.go} onChange=${e => sp('go', e.target.value)}><option value="new">Juegos: más nuevo primero</option><option value="old">Juegos: más antiguo primero</option><option value="az">Juegos: A → Z</option></select>
   <select aria-label="Orden de los Pokémon" value=${pr.po} onChange=${e => sp('po', e.target.value)}><option value="num">Pokémon: nº ascendente</option><option value="desc">Pokémon: nº descendente</option><option value="az">Pokémon: A → Z</option></select>
   <button style=${{ flex: '0 0 auto' }} class=${pr.forms ? 'on' : ''} onClick=${() => sp('forms', !pr.forms)}>Formas</button></div>
  ${gm ? html`<div class="hint">Toca un Pokémon para marcarlo en este juego; toca su imagen para ver el detalle.</div>` : null}
  <input style=${{ marginTop: 8 }} type="search" placeholder="Buscar Pokémon o forma…" value=${q} onInput=${e => setQ(e.target.value)}/>
  <div class="chips"><button class=${reg < 0 ? 'on' : ''} onClick=${() => setReg(-1)}>Todas</button>${REGIONS.map((r, i) => html`<button key=${r.name} class=${reg === i ? 'on' : ''} onClick=${() => setReg(i)}>${r.name}</button>`)}</div></header>
  ${groups.length ? groups.map(({ r, all, list }) => html`<div key=${r.name}><h2><span>${r.name}</span><span>${all.filter(x => own(x.k)).length}/${all.length}</span></h2>
   <div class="list">${list.map(x => {
        const n = x.k, e = data[n]; return html`<div class="row" key=${n} onClick=${() => gm ? tgl(n) : setSel(n)}>
    <span onClick=${ev => { ev.stopPropagation(); setSel(n) }}><${Sprite} name=${n} s=${x.s}/></span><div class="nm"><b class=${own(n) ? '' : 'mu'}><span class="num">#${String(NUM[x.b]).padStart(4, '0')}</span>${label(x, pr.forms)}</b>${e && e.games.length ? html`<small>${gs(e.games).join(', ')}</small>` : null}</div>
    ${e && e.shiny ? html`<span class="tg y">✦</span>` : null}${e && e.alpha ? html`<span class="tg p">α</span>` : null}${e && e.mega ? html`<span class="tg o">M</span>` : null}${e && e.gmax ? html`<span class="tg r">G</span>` : null}
    <span class=${'ck' + (own(n) ? ' on' : '')}>${own(n) ? '✓' : ''}</span></div>`
      })}</div></div>`) : html`<div class="empty">Sin resultados.</div>`}
  <${Footer}/>
  <div style=${{ height: 30 }}></div>
  ${sx ? html`<${Sheet} key=${sx.k} x=${sx} title=${label(sx, pr.forms)} e=${{ ...blank, ...(data[sel] || {}) }} av=${av(sx)} upd=${upd} del=${del} close=${() => setSel(null)} gs=${gs}/>` : null}</div>`
    }
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>

</html>
